name: Play Store Deploy

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play Store track to deploy to
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - production

jobs:
  build:
    name: Build signed app bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create local.properties
        env:
          REVENUECAT_PLAY_STORE_API_KEY: ${{ secrets.REVENUECAT_PLAY_STORE_API_KEY }}
        run: |
          printf 'REVENUECAT_PLAY_STORE_API_KEY=%s\n' "$REVENUECAT_PLAY_STORE_API_KEY" > local.properties

      - name: Calculate version
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        run: ./gradlew :app:bundleRelease -PYAMS_VERSION_CODE=${{ steps.version.outputs.code }} -PYAMS_VERSION_NAME=1.0.${{ steps.version.outputs.code }} -x lintVitalAnalyzeRelease --no-daemon --stacktrace

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yams-release.jks"

      - name: Sign app bundle
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          jarsigner \
            -keystore "$RUNNER_TEMP/yams-release.jks" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -keypass "$SIGNING_KEY_PASSWORD" \
            -signedjar "$RUNNER_TEMP/app-release-signed.aab" \
            app/build/outputs/bundle/release/app-release.aab \
            "$SIGNING_KEY_ALIAS"
          jarsigner -verify "$RUNNER_TEMP/app-release-signed.aab"

      - name: Upload signed app bundle
        uses: actions/upload-artifact@v7
        with:
          name: signed-app-bundle
          path: ${{ runner.temp }}/app-release-signed.aab

      - name: Upload mapping file
        uses: actions/upload-artifact@v7
        with:
          name: mapping-file
          path: app/build/outputs/mapping/release/mapping.txt

  deploy:
    name: Deploy to Play Store
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Deploy to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.maximerollin.yams
          releaseFiles: ${{ github.workspace }}/app-release-signed.aab
          mappingFile: ${{ github.workspace }}/mapping.txt
          tracks: ${{ github.event.inputs.track }}
